name: Essai du modèle sur 10 ans
on:
  workflow_dispatch:
    inputs:
      script:
        description: script à lancer
        default: outils/essai_long.py
jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet cryptography==44.0.0 numpy==2.1.3 lightgbm==4.5.0 pandas==2.2.3
      - name: Comparer référence, modèle actuel et nouveau modèle
        env:
          CLE_DONNEES: ${{ secrets.CLE_DONNEES }}
        run: python3 ${{ inputs.script }}
