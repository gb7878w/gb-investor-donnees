name: Sonde des marchés Euronext
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-2iypx2]
    paths: [outils/sonde8.py, .github/workflows/sonde-marches.yml]
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 outils/sonde8.py
