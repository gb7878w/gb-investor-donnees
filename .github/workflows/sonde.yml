name: Sonde des sources
on:
  workflow_dispatch:
  push:
    paths: [outils/**, univers/**, .github/workflows/sonde.yml]
permissions:
  contents: read
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: cd outils && python3 sonde5.py
